# Render blueprint — Travity quote server + frontend static site.
# https://dashboard.render.com/blueprints from the repo root picks this up.
services:
   # ---- Quote server (Express, fare -> GEN, /api/reserve + /status) ----
  - type: web
    name: travity-booking-provider
    runtime: node
    rootDir: booking-provider
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      # Must equal BOOKING_PROVIDER_API_KEY on travity-server (server sends it
      # as Bearer on /offer-hold, /confirm, /order-status, /cancel).
      - key: BOOKING_PROVIDER_API_KEY
        sync: false
      - key: DUFFEL_API_KEY
        sync: false

  - type: web
    name: travity-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: QUOTE_PROVIDER
        value: rapid
      - key: RAPID_API_KEY
        sync: false
      - key: GEN_USD_RATE
        value: "200"
      - key: GEN_TTL_MS
        value: "300000"
      - key: QUOTE_TTL_MS
        value: "1800000"
      - key: QUOTE_PROXY_RATE_LIMIT
        value: "30"
      # Operator credential for overrides + reaper. Required in production.
      - key: PNR_SECRET
        sync: false
      - key: OPERATOR_SECRET
        sync: false
      # Hold→confirm booking flow: /api/reserve calls /offer-hold (free),
      # /api/confirm-purchase calls /confirm (paid). Required in production.
      - key: BOOKING_PROVIDER_URL
        value: https://travity-booking-provider.onrender.com/book
      - key: BOOKING_PROVIDER_API_KEY
        sync: false
      # Independent carrier-status source for completion/refund evidence.
      # Required in production: settlement rejects date-rule alone.
      - key: AVIATIONSTACK_KEY
        sync: false

  # ---- Frontend (React + Vite static site; free on Render) ----
  # VITE_* vars are baked into the bundle at BUILD time — changing one here or
  # in the dashboard requires a new deploy to take effect.
  - type: web
    name: travity-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GENLAYER_RPC
        value: https://studio.genlayer.com/api
      - key: VITE_GENLAYER_CONTRACT_ADDRESS
        value: 0x93917fdeb92E31B108F002368229d8bbE9C7406e
      - key: VITE_GENLAYER_CHAIN_ID
        value: "61999"
      # Public quote server origin — also the on-chain feed root set via
      # set_feed_url. Must stay in sync with VITE_QUOTE_API semantics.
      - key: VITE_QUOTE_API
        value: https://travity-server.onrender.com
      # Contract owner address — shows the owner admin panel when this wallet
      # is connected. Public by nature (it's an on-chain address).
      - key: VITE_GENLAYER_OWNER_ADDRESS
        sync: false
      # Optional: WalletConnect project id (cloud.walletconnect.com). Leave
      # unset to fall back to an injected wallet extension.
      - key: VITE_WC_PROJECT_ID
        sync: false
    # SPA routing: let react-router handle /book, /disputes, etc.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ---- Expired-hold reaper (NOT a Render cron: cron jobs need a paid plan) ----
# Instead, point a free external scheduler (e.g. cron-job.org) at:
#   POST https://travity-server.onrender.com/api/reaper {"execute": true}
# with header  Authorization: Bearer <OPERATOR_SECRET>  every 5 minutes.
# It lists expired holds (cancel_hold refunds escrow on-chain) and orphan paid
# Duffel orders (POST booking-provider /cancel refunds test-mode balance).
# cron:
# - name: travity-reaper
#   runtime: node
#   schedule: "*/5 * * * *"
#   buildCommand: npm ci
#   startCommand: node scripts/reaper-ping.mjs
